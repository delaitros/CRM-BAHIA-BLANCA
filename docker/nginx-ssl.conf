# HTTP: redirect todo a HTTPS (con excepción para renovación de cert)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://complejolodejuan.com$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name complejolodejuan.com www.complejolodejuan.com;

    ssl_certificate /etc/letsencrypt/live/complejolodejuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complejolodejuan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Páginas públicas
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Admin panel
    location /admin/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a Chatwoot
    location /chatwoot/ {
        proxy_pass http://chatwoot-web:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook del Agente IA
    location /webhook/ {
        proxy_pass http://ai-agent:4000/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del Agente IA
    location /api/ {
        proxy_pass http://ai-agent:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
