<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Admin — Lo de Juan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#b7102a",
            "primary-container": "#db313f",
            "on-primary": "#ffffff",
            "surface": "#f8f9fa",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f4f5",
            "on-surface": "#191c1d",
            "outline": "#717786",
          },
          fontFamily: {
            "headline": ["Manrope", "sans-serif"],
            "body": ["Manrope", "sans-serif"],
          },
        },
      },
    }
  </script>
  <style>
    .login-bg {
      background: linear-gradient(135deg, #b7102a 0%, #7a0016 50%, #191c1d 100%);
      min-height: 100vh;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      border-radius: 1.5rem;
      box-shadow: 0 32px 80px rgba(0,0,0,0.25);
    }
    .login-input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 3rem;
      border: 2px solid #e1e3e4;
      border-radius: 0.875rem;
      font-size: 0.9375rem;
      font-family: 'Manrope', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .login-input:focus {
      border-color: #b7102a;
      box-shadow: 0 0 0 4px rgba(183,16,42,0.1);
    }
    .login-btn {
      width: 100%;
      padding: 0.9375rem;
      background: linear-gradient(135deg, #b7102a, #db313f);
      color: white;
      border: none;
      border-radius: 0.875rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(183,16,42,0.35);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(183,16,42,0.4); }
    .login-btn:active { transform: translateY(0); }
    .error-msg {
      background: #fff1f2; color: #b7102a;
      border: 1px solid #fda4af;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
    }
    .error-msg.show { display: flex; align-items: center; gap: 0.5rem; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-8px); }
      40%,80% { transform: translateX(8px); }
    }
  </style>
</head>
<body class="font-body">

  <div class="login-bg flex items-center justify-center p-4">

    <!-- Background decoration -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-white/5"></div>
      <div class="absolute -bottom-20 -left-20 w-80 h-80 rounded-full bg-white/5"></div>
      <div class="absolute top-1/2 left-1/4 w-2 h-2 rounded-full bg-white/30"></div>
      <div class="absolute top-1/3 right-1/3 w-3 h-3 rounded-full bg-white/20"></div>
    </div>

    <div class="login-card w-full max-w-md p-10 relative z-10">

      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 mb-4">
          <span class="material-symbols-outlined text-primary text-3xl">restaurant</span>
        </div>
        <h1 class="text-2xl font-extrabold text-on-surface font-headline mb-1">Lo de Juan</h1>
        <p class="text-sm text-outline font-medium">Panel de Administración</p>
      </div>

      <!-- Error message -->
      <div class="error-msg mb-4" id="error-msg">
        <span class="material-symbols-outlined text-lg flex-shrink-0">error</span>
        <span>Contraseña incorrecta. Intentá de nuevo.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="space-y-4">

          <!-- Password field -->
          <div>
            <label class="block text-sm font-semibold text-on-surface mb-2">Contraseña</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
              <input
                type="password"
                id="password-input"
                class="login-input"
                placeholder="Tu contraseña de acceso"
                autocomplete="current-password"
                autofocus
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors"
              >
                <span class="material-symbols-outlined text-xl" id="eye-icon">visibility_off</span>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="login-btn mt-2">
            Ingresar al panel
          </button>

        </div>
      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <a href="/" class="text-sm text-outline hover:text-primary transition-colors font-medium inline-flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          Volver al sitio
        </a>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Si ya está logueado, redirigir al dashboard
    if (isAuthenticated()) {
      window.location.href = '/admin/dashboard.html';
    }

    var form = document.getElementById('login-form');
    var input = document.getElementById('password-input');
    var errorMsg = document.getElementById('error-msg');
    var toggleBtn = document.getElementById('toggle-password');
    var eyeIcon = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', function() {
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.textContent = 'visibility';
      } else {
        input.type = 'password';
        eyeIcon.textContent = 'visibility_off';
      }
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var password = input.value;
      if (login(password)) {
        window.location.href = '/admin/dashboard.html';
      } else {
        errorMsg.classList.add('show');
        form.classList.add('shake');
        input.value = '';
        input.focus();
        setTimeout(function() { form.classList.remove('shake'); }, 400);
      }
    });

    input.addEventListener('input', function() {
      errorMsg.classList.remove('show');
    });
  </script>
</body>
</html>
